services:

  frontend:

    build: ./frontend

    ports:
      - "8080:80"

    depends_on:
      - backend


  backend:

    build: ./backend

    expose:
      - "5000"

    depends_on:
      - database


  database:

    image: mysql:8.0

    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: appdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword

    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

    expose:
      - "3306"


volumes:

  mysql-data:
