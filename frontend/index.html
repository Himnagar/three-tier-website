<!DOCTYPE html>
<html>
<head>
    <title>Three Tier Application</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 100px;
            background: #f4f4f4;
        }

        .container {
            background: white;
            width: 500px;
            margin: auto;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        button {
            padding: 12px 25px;
            font-size: 16px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Three Tier Architecture</h1>

    <p>Frontend → Backend → Database</p>

    <button onclick="getData()">
        Get Data
    </button>

    <div id="result"></div>

</div>

<script>

async function getData() {

    try {

        const response = await fetch('/api/users');

        const data = await response.json();

        document.getElementById("result").innerHTML =
            "Message: " + data.message +
            "<br>User: " + data.user;

    } catch (error) {

        document.getElementById("result").innerHTML =
            "Error connecting to backend";

    }

}

</script>

</body>
</html>
